# Read-only identity for Devops-Konnekt. It can list/read pods, their logs, events and
# namespaces, and nothing else: no secrets, no exec, no create/update/delete.
apiVersion: v1
kind: Namespace
metadata:
  name: devops-konnekt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-konnekt-reader
  namespace: devops-konnekt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-konnekt-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-konnekt-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-konnekt-reader
subjects:
  - kind: ServiceAccount
    name: devops-konnekt-reader
    namespace: devops-konnekt
