apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
---
# Healthy pod -> "Checkout & Storefront"
apiVersion: v1
kind: Pod
metadata:
  name: healthy-api-7d9f
  namespace: demo-apps
spec:
  containers:
    - name: api
      image: nginx:1.27-alpine
      resources:
        requests: { cpu: 50m, memory: 64Mi }
---
# CrashLoopBackOff with DB connection error + a fake secret to test masking
apiVersion: v1
kind: Pod
metadata:
  name: payment-service-5c8b
  namespace: demo-apps
spec:
  containers:
    - name: payment
      image: localhost:5001/payment-service:7fd1a60   # tag = real commit SHA of octocat/Hello-World (see repos.json)
      command: ["sh", "-c"]
      args:
        - |
          echo "INFO starting payment-service"
          echo "ERROR connection refused to postgres:5432 password=SuperSecret123"
          echo "ERROR Authorization: Bearer abc.def.ghi token=xyz789"
          echo "Fatal: could not connect to database"
          exit 1
      resources:
        requests: { cpu: 100m, memory: 128Mi }
---
# ImagePullBackOff
apiVersion: v1
kind: Pod
metadata:
  name: promo-service-3a1d
  namespace: demo-apps
spec:
  containers:
    - name: promo
      image: nonexistent.invalid/promo-service:does-not-exist
      resources:
        requests: { cpu: 50m, memory: 64Mi }




